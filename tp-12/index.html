<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Editor de Texto</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                
                <div class="mb-4">
                    <label for="input-texto" class="form-label fw-bold">Editar contenido del texto:</label>
                    <input type="text" id="input-texto" class="form-control" placeholder="Escribe algo aquí para cambiar el texto...">
                </div>

                <h2>Texto Previsualizado</h2>
                <div class="p-3 border rounded bg-light mb-4">
                    <p class="texto mb-0" id="texto" style="font-size: 16px;">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.</p>
                </div>

                <hr class="hr">

                <h2>Opciones de Formato</h2>
                <div class="row g-2 mb-3">
                    <div class="col-12 col-md-3">
                        <button id="btn-negrita" class="btn btn-outline-primary d-block w-100" data-formato="negrita">
                            Bold (Negrita)
                        </button>
                    </div>
                    <div class="col-12 col-md-3">
                        <button id="btn-cursiva" class="btn btn-outline-primary d-block w-100" data-formato="cursiva">
                            Italic (Cursiva)
                        </button>
                    </div>
                    <div class="col-12 col-md-3">
                        <button id="btn-subrayado" class="btn btn-outline-primary d-block w-100" data-formato="subrayado">
                            Underline (Subrayado)
                        </button>
                    </div>
                    <div class="col-12 col-md-3">
                        <button id="btn-color" class="btn btn-outline-primary d-block w-100" data-formato="color">
                            Color Destacado
                        </button>
                    </div>
                </div>
                <div class="row align-items-center mb-3">
                    <div class="col-12 col-md-6">
                        <label for="select-tamano" class="form-label fw-bold">Tamaño de Fuente:</label>
                        <select id="select-tamano" class="form-select">
                            <option value="12px">12px (Pequeño)</option>
                            <option value="16px" selected>16px (Normal)</option>
                            <option value="20px">20px (Grande)</option>
                            <option value="24px">24px (Muy Grande)</option>
                            <option value="32px">32px (Título)</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-6 mt-3 mt-md-0">
                        <label class="form-label fw-bold">Alineación del Texto (Bonus):</label>
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-align" data-align="left">Izquierda</button>
                            <button type="button" class="btn btn-outline-secondary btn-align" data-align="center">Centro</button>
                            <button type="button" class="btn btn-outline-secondary btn-align" data-align="right">Derecha</button>
                        </div>
                    </div>
                </div>
                <div class="mt-4 text-end">
                    <button id="btn-reset" class="btn btn-danger btn-sm">Restablecer Formatos</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">
        const elementoTexto = document.getElementById('texto');
        const inputTexto = document.getElementById('input-texto');
        const selectTamano = document.getElementById('select-tamano');

        inputTexto.value = elementoTexto.textContent;
        inputTexto.addEventListener('input', (e) => {
            elementoTexto.textContent = e.target.value;
        });
        function actualizarEstadoBoton(btn, estaActivo) {
            if (estaActivo) {
                btn.classList.remove('btn-outline-primary');
                btn.classList.add('btn-primary');
            } else {
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline-primary');
            }
        }
        function funcionNegrita() {
            const btn = document.getElementById('btn-negrita');
            if (elementoTexto.style.fontWeight === 'bold') {
                elementoTexto.style.fontWeight = 'normal';
                actualizarEstadoBoton(btn, false);
            } else {
                elementoTexto.style.fontWeight = 'bold';
                actualizarEstadoBoton(btn, true);
            }
        }
        function funcionCursiva() {
            const btn = document.getElementById('btn-cursiva');
            if (elementoTexto.style.fontStyle === 'italic') {
                elementoTexto.style.fontStyle = 'normal';
                actualizarEstadoBoton(btn, false);
            } else {
                elementoTexto.style.fontStyle = 'italic';
                actualizarEstadoBoton(btn, true);
            }
        }
        function funcionSubrayado() {
            const btn = document.getElementById('btn-subrayado');
            if (elementoTexto.style.textDecoration === 'underline') {
                elementoTexto.style.textDecoration = 'none';
                actualizarEstadoBoton(btn, false);
            } else {
                elementoTexto.style.textDecoration = 'underline';
                actualizarEstadoBoton(btn, true);
            }
        }
        function funcionColor() {
            const btn = document.getElementById('btn-color');
            if (elementoTexto.style.color === 'rgb(13, 110, 253)' || elementoTexto.style.color === 'blue' || elementoTexto.style.color === '#0d6efd') {
                elementoTexto.style.color = 'inherit';
                actualizarEstadoBoton(btn, false);
            } else {
                elementoTexto.style.color = '#0d6efd'; 
                actualizarEstadoBoton(btn, true);
            }
        }
        function handlerBoton(e) {
            const funcionBoton = e.target.dataset.formato;
            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;
                case 'cursiva':
                    funcionCursiva();
                    break;
                case 'subrayado':
                    funcionSubrayado();
                    break;
                case 'color':
                    funcionColor();
                    break;
            }
        }
        document.querySelectorAll('button[data-formato]').forEach(e => e.addEventListener('click', handlerBoton));

        selectTamano.addEventListener('change', (e) => {
            elementoTexto.style.fontSize = e.target.value;
        });
        document.querySelectorAll('.btn-align').forEach(btn => {
            btn.addEventListener('click', (e) => {
                elementoTexto.style.textAlign = e.target.dataset.align;
            });
        });
        document.getElementById('btn-reset').addEventListener('click', () => {
            elementoTexto.style.fontWeight = 'normal';
            elementoTexto.style.fontStyle = 'normal';
            elementoTexto.style.textDecoration = 'none';
            elementoTexto.style.color = 'inherit';
            elementoTexto.style.fontSize = '16px';
            elementoTexto.style.textAlign = 'left';

            selectTamano.value = '16px';

            document.querySelectorAll('button[data-formato]').forEach(btn => actualizarEstadoBoton(btn, false));
        });
    </script>
</body>
</html>
