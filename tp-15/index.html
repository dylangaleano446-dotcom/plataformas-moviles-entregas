<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1 class="mb-4">Tablero de Puntos</h1>
    
        <div class="card mb-4" id="tarjetaTablero">
            <div class="card-body">
                <div class="row text-center align-items-center">
                    <div class="col-5">
                        <span class="display-1 fw-bold" id="puntajeLocal">0</span>
                        <p class="fs-4 m-0 fw-semibold" id="nombreLocal">Local</p>
                    </div>
                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>
                    <div class="col-5">
                        <span class="display-1 fw-bold" id="puntajeVisitante">0</span>
                        <p class="fs-4 m-0 fw-semibold" id="nombreVisitante">Visitante</p>
                    </div>
                </div>

                <hr class="hr my-4">
                
                <h2>Actualizar Contador</h2>
                <div class="row g-2 mb-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-bold">Local</label>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary w-100 btn-control" id="btnSumarLocal">+ Punto Local</button>
                            <button class="btn btn-outline-primary w-100 btn-control" id="btnRestarLocal">- Punto Local</button>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-bold">Visitante</label>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary w-100 btn-control" id="btnSumarVisitante">+ Punto Visitante</button>
                            <button class="btn btn-outline-primary w-100 btn-control" id="btnRestarVisitante">- Punto Visitante</button>
                        </div>
                    </div>
                </div>
                <div class="row g-2">
                    <div class="col-12 col-sm-4">
                        <button class="btn btn-warning w-100 text-dark fw-bold btn-control" id="btnInvertir">
                            Invertir Puntaje
                        </button>
                    </div>
                    <div class="col-12 col-sm-4">
                        <button class="btn btn-secondary w-100 fw-bold" id="btnFinalizar">
                            Finalizar Partido
                        </button>
                    </div>
                    <div class="col-12 col-sm-4">
                        <button class="btn btn-danger w-100 fw-bold" id="btnReiniciar">
                            Reinicio
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-header bg-light">
                <h5 class="card-title m-0">Personalización y Ajustes</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    
                    <div class="col-12 col-md-6">
                        <label for="inputLocal" class="form-label">Nombre Equipo Local</label>
                        <input type="text" class="form-control" id="inputLocal" value="Local">
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="inputVisitante" class="form-label">Nombre Equipo Visitante</label>
                        <input type="text" class="form-control" id="inputVisitante" value="Visitante">
                    </div>
                    
                    <div class="col-12 col-md-4">
                        <label for="inputColorFondo" class="form-label">Color de Fondo del Tablero</label>
                        <input type="color" class="form-control form-control-color w-100" id="inputColorFondo" value="#ffffff" title="Elegir color de fondo">
                    </div>
                  
                    <div class="col-12 col-md-4">
                        <label for="inputColorLocal" class="form-label">Color Texto Local</label>
                        <input type="color" class="form-control form-control-color w-100" id="inputColorLocal" value="#212529" title="Elegir color equipo local">
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="inputColorVisitante" class="form-label">Color Texto Visitante</label>
                        <input type="color" class="form-control form-control-color w-100" id="inputColorVisitante" value="#212529" title="Elegir color equipo visitante">
                    </div>
                </div>

                <div class="alert alert-info mt-3 mb-0 small">
                    <strong>Atajos de teclado:</strong><br>
                    <strong>A</strong> / <strong>Z</strong>: Sumar / Restar punto a Local<br>
                    <strong>L</strong> / <strong>M</strong>: Sumar / Restar punto a Visitante<br>
                    <strong>I</strong>: Invertir puntajes | <strong>F</strong>: Finalizar partido | <strong>R</strong>: Reiniciar
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script>
       
        let puntosLocal = 0;
        let puntosVisitante = 0;
        let partidoFinalizado = false;

        const elPuntajeLocal = document.getElementById('puntajeLocal');
        const elPuntajeVisitante = document.getElementById('puntajeVisitante');
        const elNombreLocal = document.getElementById('nombreLocal');
        const elNombreVisitante = document.getElementById('nombreVisitante');
        const tarjetaTablero = document.getElementById('tarjetaTablero');

        const btnSumarLocal = document.getElementById('btnSumarLocal');
        const btnRestarLocal = document.getElementById('btnRestarLocal');
        const btnSumarVisitante = document.getElementById('btnSumarVisitante');
        const btnRestarVisitante = document.getElementById('btnRestarVisitante');
        const btnInvertir = document.getElementById('btnInvertir');
        const btnFinalizar = document.getElementById('btnFinalizar');
        const btnReiniciar = document.getElementById('btnReiniciar');

        const inputLocal = document.getElementById('inputLocal');
        const inputVisitante = document.getElementById('inputVisitante');
        const inputColorFondo = document.getElementById('inputColorFondo');
        const inputColorLocal = document.getElementById('inputColorLocal');
        const inputColorVisitante = document.getElementById('inputColorVisitante');

        const botonesPuntaje = document.querySelectorAll('.btn-control');
        function render() {
            elPuntajeLocal.textContent = puntosLocal;
            elPuntajeVisitante.textContent = puntosVisitante;
        }
        function agregarPuntoLocal(cantidad) {
            if (partidoFinalizado) return;
            puntosLocal = Math.max(0, puntosLocal + cantidad);
            render();
        }

        function agregarPuntoVisitante(cantidad) {
            if (partidoFinalizado) return;
            puntosVisitante = Math.max(0, puntosVisitante + cantidad);
            render();
        }

        function invertirPuntaje() {
            if (partidoFinalizado) return;
            const aux = puntosLocal;
            puntosLocal = puntosVisitante;
            puntosVisitante = aux;
            render();
        }

        function finalizarPartido() {
            partidoFinalizado = true;
            botonesPuntaje.forEach(btn => btn.disabled = true);
            btnFinalizar.disabled = true;
        }

        function reiniciarTablero() {
            puntosLocal = 0;
            puntosVisitante = 0;
            partidoFinalizado = false;
            botonesPuntaje.forEach(btn => btn.disabled = false);
            btnFinalizar.disabled = false;
            render();
        }
        btnSumarLocal.addEventListener('click', () => agregarPuntoLocal(1));
        btnRestarLocal.addEventListener('click', () => agregarPuntoLocal(-1));
        btnSumarVisitante.addEventListener('click', () => agregarPuntoVisitante(1));
        btnRestarVisitante.addEventListener('click', () => agregarPuntoVisitante(-1));
        btnInvertir.addEventListener('click', invertirPuntaje);
        btnFinalizar.addEventListener('click', finalizarPartido);
        btnReiniciar.addEventListener('click', reiniciarTablero);

        inputLocal.addEventListener('input', (e) => {
            elNombreLocal.textContent = e.target.value.trim() || 'Local';
        });

        inputVisitante.addEventListener('input', (e) => {
            elNombreVisitante.textContent = e.target.value.trim() || 'Visitante';
        });

        inputColorFondo.addEventListener('input', (e) => {
            tarjetaTablero.style.backgroundColor = e.target.value;
        });

        inputColorLocal.addEventListener('input', (e) => {
            elPuntajeLocal.style.color = e.target.value;
            elNombreLocal.style.color = e.target.value;
        });

        inputColorVisitante.addEventListener('input', (e) => {
            elPuntajeVisitante.style.color = e.target.value;
            elNombreVisitante.style.color = e.target.value;
        });
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;

            const tecla = e.key.toLowerCase();
            switch (tecla) {
                case 'a':
                    agregarPuntoLocal(1);
                    break;
                case 'z':
                    agregarPuntoLocal(-1);
                    break;
                case 'l':
                    agregarPuntoVisitante(1);
                    break;
                case 'm':
                    agregarPuntoVisitante(-1);
                    break;
                case 'i':
                    invertirPuntaje();
                    break;
                case 'f':
                    finalizarPartido();
                    break;
                case 'r':
                    reiniciarTablero();
                    break;
            }
        });
    </script>
</body>
</html>
