<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>
                
                <ul id="lista-productos" class="list-unstyled">
                    <li>Pan</li>
                </ul>

                <button id="btn-ordenar" type="button" class="btn btn-outline-secondary btn-sm">Ordenar A-Z</button>
                <button id="btn-limpiar" type="button" class="btn btn-outline-danger btn-sm">Limpiar lista</button>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit">Agregar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        const CLAVE_STORAGE = 'lista-compras';
        const lista = document.getElementById('lista-productos');

        function crearItem(nombre, comprado) {
            const li = document.createElement('li');
            li.className = 'mb-2 d-flex align-items-center gap-2';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'form-check-input mt-0';
            checkbox.checked = comprado;

            const span = document.createElement('span');
            span.className = 'nombre me-auto';
            span.textContent = nombre;
            if (comprado) {
                span.classList.add('text-decoration-line-through', 'text-muted');
            }

            checkbox.addEventListener('change', function () {
                span.classList.toggle('text-decoration-line-through', checkbox.checked);
                span.classList.toggle('text-muted', checkbox.checked);
                guardarLista();
            });

            const btnEditar = document.createElement('button');
            btnEditar.type = 'button';
            btnEditar.className = 'btn btn-outline-primary btn-sm';
            btnEditar.textContent = 'Editar';
            btnEditar.addEventListener('click', function () {
                editarProducto(span);
            });

            const btnEliminar = document.createElement('button');
            btnEliminar.type = 'button';
            btnEliminar.className = 'btn btn-outline-danger btn-sm';
            btnEliminar.textContent = 'Eliminar';
            btnEliminar.addEventListener('click', function () {
                eliminarProducto(li);
            });

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(btnEditar);
            li.appendChild(btnEliminar);
            return li;
        }

        function agregarProducto(nombreProducto) {
            const nombre = nombreProducto.trim();
            if (nombre === '') {
                return;
            }
            lista.appendChild(crearItem(nombre, false));
            guardarLista();
        }

        function eliminarProducto(li) {
            li.remove();
            guardarLista();
        }

        function limpiarLista() {
            lista.innerHTML = '';
            guardarLista();
        }

        function ordenarLista() {
            const items = Array.from(lista.children);
            items.sort(function (a, b) {
                const nombreA = a.querySelector('.nombre').textContent;
                const nombreB = b.querySelector('.nombre').textContent;
                return nombreA.localeCompare(nombreB, 'es', { sensitivity: 'base' });
            });
            items.forEach(function (item) {
                lista.appendChild(item);
            });
            guardarLista();
        }

        function editarProducto(span) {
            const nuevoNombre = prompt('Nuevo nombre del producto:', span.textContent);
            if (nuevoNombre !== null && nuevoNombre.trim() !== '') {
                span.textContent = nuevoNombre.trim();
                guardarLista();
            }
        }

        function guardarLista() {
            const productos = Array.from(lista.children).map(function (li) {
                return {
                    nombre: li.querySelector('.nombre').textContent,
                    comprado: li.querySelector('input[type="checkbox"]').checked
                };
            });
            localStorage.setItem(CLAVE_STORAGE, JSON.stringify(productos));
        }

        function cargarLista() {
            let productos = [{ nombre: 'Pan', comprado: false }];
            const guardado = localStorage.getItem(CLAVE_STORAGE);
            if (guardado !== null) {
                try {
                    const datos = JSON.parse(guardado);
                    if (Array.isArray(datos)) {
                        productos = datos;
                    }
                } catch (error) {
                
                }
            }
            lista.innerHTML = '';
            productos.forEach(function (producto) {
                lista.appendChild(crearItem(producto.nombre, producto.comprado));
            });
        }

        function handlerFormulario(evento) {
            evento.preventDefault();
            const input = evento.target.querySelector('input');
            const nombreProducto = input.value;
            input.value = "";
            agregarProducto(nombreProducto);
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);
        document.getElementById('btn-limpiar').addEventListener('click', limpiarLista);
        document.getElementById('btn-ordenar').addEventListener('click', ordenarLista);

        cargarLista();
    </script>
</body>
</html>
