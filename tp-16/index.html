<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería · TP-16</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Narrow:wght@400;600&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header class="gallery-header">
    <div class="container">
      <h1 class="gallery-title">Galería de obras</h1>
      <p class="gallery-lead mb-0">
        Obras de dominio público de la colección del Art Institute of Chicago.
      </p>
    </div>
  </header>

  <main class="container py-4">

    <form id="search-form" class="row g-2 mb-3" role="search">
      <div class="col-12 col-md-8 col-lg-6">
        <label for="search" class="visually-hidden">Buscar obras</label>
        <input id="search" type="search" class="form-control"
               placeholder="Buscá por tema, artista u objeto (en inglés funciona mejor)" autocomplete="off">
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-gallery">Buscar</button>
      </div>
    </form>

    <div id="categories" class="d-flex flex-wrap gap-2 mb-4" role="group" aria-label="Categorías"></div>

    <p id="summary" class="summary" aria-live="polite"></p>

    <div id="initial-spinner" class="text-center py-5 d-none" role="status">
      <div class="spinner-border gallery-spinner" style="width:3rem;height:3rem"></div>
      <p class="mt-3 mb-0">Cargando obras…</p>
    </div>

    <div id="error-box" class="alert alert-danger d-none" role="alert">
      <p id="error-text" class="mb-2"></p>
      <button id="retry-btn" type="button" class="btn btn-sm btn-danger">Reintentar</button>
    </div>

    <div id="grid" class="row g-4 row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4"></div>

    <p id="empty" class="text-center py-5 d-none">
      No encontramos obras para esa búsqueda. Probá con otra palabra.
    </p>

    <div class="text-center mt-5">
      <button id="load-more" type="button" class="btn btn-gallery d-none">
        <span id="load-more-spinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
        <span id="load-more-label">Ver más obras</span>
      </button>
    </div>
  </main>

  <div class="modal fade" id="detail-modal" tabindex="-1" aria-labelledby="detail-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-4" id="detail-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="detail-body"></div>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 gallery-footer">
    TP-16 · Consumo de APIs con la
    <a href="https://api.artic.edu/docs/" target="_blank" rel="noopener">API del Art Institute of Chicago</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
