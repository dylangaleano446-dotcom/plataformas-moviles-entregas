<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Series de TV · TP-16</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <header class="tv-header">
    <div class="container">
      <h1 class="tv-title">Cartelera de series</h1>
      <p class="tv-lead mb-0">Explorá series de TV con datos de la API de TVmaze.</p>
    </div>
  </header>

  <main class="container py-4">

    <!-- Buscador -->
    <form id="search-form" class="row g-2 mb-3" role="search">
      <div class="col-12 col-md-8 col-lg-6">
        <label for="search" class="visually-hidden">Buscar series</label>
        <input id="search" type="search" class="form-control"
               placeholder="Buscá una serie por nombre (ej: Friends)" autocomplete="off">
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-tv">Buscar</button>
      </div>
      <div class="col-auto">
        <button id="reset-btn" type="button" class="btn btn-outline-secondary">Ver todas</button>
      </div>
    </form>

    <!-- Filtro por género -->
    <div id="categories" class="d-flex flex-wrap gap-2 mb-4" role="group" aria-label="Géneros"></div>

    <p id="summary" class="tv-summary" aria-live="polite"></p>

    <!-- Spinner de carga inicial -->
    <div id="initial-spinner" class="text-center py-5 d-none" role="status">
      <div class="spinner-border tv-spinner" style="width:3rem;height:3rem"></div>
      <p class="mt-3 mb-0">Cargando series…</p>
    </div>

    <!-- Error -->
    <div id="error-box" class="alert alert-danger d-none" role="alert">
      <p id="error-text" class="mb-2"></p>
      <button id="retry-btn" type="button" class="btn btn-sm btn-danger">Reintentar</button>
    </div>

    <!-- Grilla de cartas -->
    <div id="grid" class="row g-4 row-cols-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-6"></div>

    <p id="empty" class="text-center py-5 d-none">
      No encontramos series con esa búsqueda o ese género. Probá con otra.
    </p>

    <div class="text-center mt-5">
      <button id="load-more" type="button" class="btn btn-tv d-none">
        <span id="load-more-spinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
        <span id="load-more-label">Ver más series</span>
      </button>
    </div>
  </main>

  <!-- Modal de detalle -->
  <div class="modal fade" id="detail-modal" tabindex="-1" aria-labelledby="detail-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-4" id="detail-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="detail-body"></div>
      </div>
    </div>
  </div>

  <footer class="text-center py-4 tv-footer">
    TP-16 · Consumo de APIs con <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener">TVmaze</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
